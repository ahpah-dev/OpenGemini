<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenGemini</title>
  <link rel="stylesheet" href="/vendor/hljs-github.min.css" id="hljs-theme" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234285F4'/%3E%3Cstop offset='50%25' stop-color='%239B72CB'/%3E%3Cstop offset='100%25' stop-color='%23D96570'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M16 2 C17.2 11.2 20.8 14.8 30 16 C20.8 17.2 17.2 20.8 16 30 C14.8 20.8 11.2 17.2 2 16 C11.2 14.8 14.8 11.2 16 2 Z'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Left Navigation Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top-row">
        <button id="brand-home-btn" class="brand-btn" title="OpenGemini Home">
          <svg class="gemini-star-icon" viewBox="0 0 28 28" width="20" height="20" aria-hidden="true">
            <defs>
              <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4285f4" />
                <stop offset="38%" stop-color="#9b72cb" />
                <stop offset="72%" stop-color="#d96570" />
                <stop offset="100%" stop-color="#fbbc05" />
              </linearGradient>
            </defs>
            <path fill="url(#geminiGrad)" d="M14 1.5C15.1 10.1 17.9 12.9 26.5 14C17.9 15.1 15.1 17.9 14 26.5C12.9 17.9 10.1 15.1 1.5 14C10.1 12.9 12.9 10.1 14 1.5Z" />
          </svg>
          <span class="brand-text">OpenGemini</span>
        </button>
        <div class="sidebar-header-actions">
          <button id="search-chats-btn" class="icon-btn-sm" title="Search chats & commands (Ctrl+K)">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <button id="toggle-sidebar-btn" class="icon-btn-sm" title="Collapse sidebar">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
          </button>
        </div>
      </div>

      <!-- Primary Navigation -->
      <nav class="sidebar-primary-nav">
        <button class="nav-item active" data-nav="new-chat" id="nav-new-chat">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <span>New chat</span>
        </button>
        <button class="nav-item" data-nav="library" id="nav-library">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14v7M14 17.5h7"/></svg>
          <span>Library</span>
        </button>
        <button class="nav-item" data-nav="images" id="nav-images">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span>Images</span>
        </button>
        <button class="nav-item" data-nav="scheduled" id="nav-scheduled">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Scheduled</span>
        </button>
        <button class="nav-item" data-nav="students" id="nav-students">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
          <span>Students</span>
        </button>
        <button class="nav-item" data-nav="more" id="nav-more">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
          <span>More</span>
        </button>
      </nav>

      <!-- Scrollable Middle Region: Notebooks + Chat History -->
      <div class="sidebar-scroll">
        <div class="sidebar-section">
          <div class="sidebar-section-header">
            <span>Notebooks</span>
          </div>
          <button id="new-notebook-sidebar-btn" class="nav-subitem">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            <span>New notebook</span>
          </button>
          <div id="sidebar-notebooks-list"></div>
          <button id="all-notebooks-btn" class="nav-subitem muted">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
            <span>All notebooks</span>
          </button>
        </div>

        <div class="sidebar-section history-section">
          <div class="sidebar-section-header">
            <span id="history-filter-label">All</span>
            <button id="filter-history-btn" class="icon-btn-xs" title="Filter chats & tasks">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 5h18l-7 8v5l-4 2v-7L3 5z"/></svg>
            </button>
          </div>
          <div id="history-filter-pills" class="history-filter-pills hidden">
            <button class="mini-pill active" data-hfilter="all">All</button>
            <button class="mini-pill" data-hfilter="chat">Chats</button>
            <button class="mini-pill" data-hfilter="task">Tasks</button>
            <button class="mini-pill" data-hfilter="pinned">Pinned</button>
          </div>
          <div id="sidebar-history-list" class="history-list"></div>
        </div>
      </div>

      <!-- Bottom User Profile & Settings -->
      <div class="sidebar-footer">
        <button id="user-profile-btn" class="user-profile-trigger" title="Account & Local Runtime Status">
          <div class="user-avatar" id="user-avatar-badge">
            <span id="user-emoji-span">😅</span>
            <span id="provider-dot" class="provider-dot online"></span>
          </div>
          <div class="user-meta">
            <span id="user-name-label" class="user-name">Ah Pah</span>
            <span id="user-tier-label" class="user-tier">Pro</span>
          </div>
        </button>
        <button id="open-settings-btn" class="icon-btn-sm" title="Settings, Local Models & BYOK Keys">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Center Workspace -->
    <main class="main-stage">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <button id="expand-sidebar-btn" class="icon-btn-sm hidden" title="Open sidebar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div id="active-context-badges" class="context-badges"></div>
        </div>
        <div class="top-bar-right">
          <button id="toggle-aux-pane-btn" class="top-pill-btn subtle" title="Open Canvas, Task Plan, Diffs & Terminal">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></svg>
            <span>Canvas &amp; Agent</span>
          </button>
          <button id="get-app-status-btn" class="top-pill-btn" title="Local AI Runtime & Desktop Launcher">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 19h14"/></svg>
            <span id="runtime-pill-label">Local AI</span>
          </button>
          <button id="temp-chat-btn" class="icon-btn-sm" title="Temporary Chat (Incognito — won't save to history)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 2.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </button>
        </div>
      </header>

      <!-- Dynamic Secondary Hub Container (Library, Images, Scheduled, Students, Notebooks, More/Gems) -->
      <section id="hub-view-container" class="hub-view-container hidden"></section>

      <!-- Chat & Task Conversation Canvas -->
      <section id="chat-stage" class="chat-stage is-empty">
        <!-- Soft Radial Blue Ambient Glow (visible on empty home screen just like Google Gemini) -->
        <div class="hero-ambient-glow" aria-hidden="true"></div>

        <!-- Scrollable Messages Stream -->
        <div id="messages-scroll" class="messages-scroll hidden">
          <div id="messages-list" class="messages-list"></div>
        </div>

        <!-- Center / Bottom Composer Wrapper -->
        <div id="composer-zone" class="composer-zone">
          <h1 id="hero-heading" class="hero-heading">Where should we start?</h1>

          <!-- Slash Command / @Mention Floating Menu -->
          <div id="slash-menu" class="floating-autocomplete hidden"></div>

          <!-- Plus (+) Attachment & Tool Menu -->
          <div id="plus-menu" class="plus-popover hidden">
            <button class="popover-item" id="upload-file-action">
              <span class="pop-icon">📎</span>
              <div>
                <div class="pop-title">Upload image or file</div>
                <div class="pop-sub">Attach code, docs, CSV, or images</div>
              </div>
            </button>
            <button class="popover-item" id="attach-workspace-action">
              <span class="pop-icon">🗂️</span>
              <div>
                <div class="pop-title">Attach workspace file (@)</div>
                <div class="pop-sub">Ground prompt in local project files</div>
              </div>
            </button>
            <button class="popover-item" id="attach-notebook-action">
              <span class="pop-icon">📓</span>
              <div>
                <div class="pop-title">Ground with Notebook</div>
                <div class="pop-sub">Connect NotebookLM sources &amp; notes</div>
              </div>
            </button>
            <div class="popover-divider"></div>
            <button class="popover-item" id="open-canvas-action">
              <span class="pop-icon">🎨</span>
              <div>
                <div class="pop-title">Canvas Mode</div>
                <div class="pop-sub">Interactive code &amp; live preview workspace</div>
              </div>
            </button>
            <button class="popover-item" id="deep-research-action">
              <span class="pop-icon">🌐</span>
              <div>
                <div class="pop-title">Deep Research</div>
                <div class="pop-sub">Autonomous multi-query web report with citations</div>
              </div>
            </button>
            <button class="popover-item" id="pick-gem-action">
              <span class="pop-icon">💎</span>
              <div>
                <div class="pop-title">Switch Gem Persona</div>
                <div class="pop-sub">Activate custom expert instructions</div>
              </div>
            </button>
          </div>
          <input type="file" id="hidden-file-input" multiple class="hidden" />

          <!-- Model & Thinking Effort Popover -->
          <div id="model-popover" class="model-popover hidden"></div>

          <!-- The Iconic Pill Input Box -->
          <div id="composer-box" class="composer-pill">
            <div id="composer-attachments" class="composer-attachments hidden"></div>
            <div class="composer-row">
              <button id="plus-btn" class="composer-icon-btn" title="Add files, Workspace context, Canvas or Deep Research">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              </button>

              <textarea
                id="prompt-input"
                class="prompt-textarea"
                rows="1"
                placeholder="Ask Gemini"
                autocomplete="off"
              ></textarea>

              <div class="composer-right-controls">
                <button id="model-picker-btn" class="model-selector-btn" title="Select Local/BYOK Model & Thinking Effort">
                  <strong id="active-model-short">Argon</strong>
                  <span id="active-effort-label" class="effort-tag">High</span>
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </button>

                <button id="voice-or-send-btn" class="composer-action-btn" title="Voice input / Send">
                  <svg id="mic-icon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>
                  <svg id="send-icon" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                  <svg id="stop-icon" class="hidden" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Chat | Task Segmented Mode Switcher (Exact Gemini UI) -->
          <div class="mode-toggle-row">
            <div class="mode-segmented-control" role="tablist" aria-label="Interaction Mode">
              <button id="mode-chat-btn" class="mode-tab active" data-mode="chat" role="tab" aria-selected="true">Chat</button>
              <button id="mode-task-btn" class="mode-tab" data-mode="task" role="tab" aria-selected="false">Task</button>
            </div>
          </div>

          <!-- Suggested Prompts List (Hero Empty State) -->
          <div id="starter-suggestions" class="starter-suggestions"></div>
        </div>
      </section>
    </main>

    <!-- Antigravity 2.0 + Gemini Canvas Auxiliary Side Pane -->
    <aside id="aux-pane" class="aux-pane hidden">
      <div class="aux-header">
        <div class="aux-tabs">
          <button class="aux-tab active" data-auxtab="canvas">Canvas</button>
          <button class="aux-tab" data-auxtab="task">Task &amp; Agents</button>
          <button class="aux-tab" data-auxtab="diffs">Files &amp; Diffs <span id="diffs-badge" class="tab-count hidden">0</span></button>
          <button class="aux-tab" data-auxtab="terminal">Terminal</button>
        </div>
        <button id="close-aux-pane-btn" class="icon-btn-sm" title="Close side pane">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="aux-body" class="aux-body"></div>
    </aside>
  </div>

  <!-- Universal Modal Overlay (Settings, Search Ctrl+K, Runtime Status, File Picker) -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal-card" class="modal-card"></div>
  </div>

  <!-- Toast Notification Stack -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Self-hosted Offline Libraries (Marked, Highlight.js) -->
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
